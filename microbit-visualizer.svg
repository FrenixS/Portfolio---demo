<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 285" role="img" aria-label="A wand Micro:bit sends radio signals to a receiver Micro:bit, which steers glowing particles on a screen" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- Soft glow used on the particles and the radio waves. -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- One Micro:bit drawn once, then reused for the wand and the receiver. -->
    <g id="mb">
      <rect width="110" height="120" rx="10" fill="#1a1a26" stroke="#00d1ff" stroke-width="2"/>
      <circle cx="29" cy="30" r="4" fill="#00d1ff"/>
      <circle cx="42" cy="30" r="4" fill="#2c2c3c"/>
      <circle cx="55" cy="30" r="4" fill="#2c2c3c"/>
      <circle cx="68" cy="30" r="4" fill="#2c2c3c"/>
      <circle cx="81" cy="30" r="4" fill="#00d1ff"/>
      <circle cx="29" cy="43" r="4" fill="#2c2c3c"/>
      <circle cx="42" cy="43" r="4" fill="#00d1ff"/>
      <circle cx="55" cy="43" r="4" fill="#2c2c3c"/>
      <circle cx="68" cy="43" r="4" fill="#00d1ff"/>
      <circle cx="81" cy="43" r="4" fill="#2c2c3c"/>
      <circle cx="29" cy="56" r="4" fill="#2c2c3c"/>
      <circle cx="42" cy="56" r="4" fill="#2c2c3c"/>
      <circle cx="55" cy="56" r="4" fill="#00d1ff"/>
      <circle cx="68" cy="56" r="4" fill="#2c2c3c"/>
      <circle cx="81" cy="56" r="4" fill="#2c2c3c"/>
      <circle cx="29" cy="69" r="4" fill="#2c2c3c"/>
      <circle cx="42" cy="69" r="4" fill="#00d1ff"/>
      <circle cx="55" cy="69" r="4" fill="#2c2c3c"/>
      <circle cx="68" cy="69" r="4" fill="#00d1ff"/>
      <circle cx="81" cy="69" r="4" fill="#2c2c3c"/>
      <circle cx="29" cy="82" r="4" fill="#00d1ff"/>
      <circle cx="42" cy="82" r="4" fill="#2c2c3c"/>
      <circle cx="55" cy="82" r="4" fill="#2c2c3c"/>
      <circle cx="68" cy="82" r="4" fill="#2c2c3c"/>
      <circle cx="81" cy="82" r="4" fill="#00d1ff"/>
      <!-- Buttons A and B. -->
      <circle cx="14" cy="56" r="8" fill="#2c2c3c" stroke="#00d1ff"/>
      <circle cx="96" cy="56" r="8" fill="#2c2c3c" stroke="#00d1ff"/>
      <text x="14" y="60" font-size="10" fill="#f0f0f0" text-anchor="middle" font-family="sans-serif">A</text>
      <text x="96" y="60" font-size="10" fill="#f0f0f0" text-anchor="middle" font-family="sans-serif">B</text>
      <!-- Gold pins along the bottom edge. -->
      <rect x="10" y="108" width="90" height="6" rx="2" fill="#c9a24a"/>
    </g>
  </defs>

  <!-- Dark background that matches the website. -->
  <rect width="700" height="285" rx="14" fill="#121218"/>

  <!-- Wand Micro:bit (battery, held in the hand). -->
  <use href="#mb" x="30" y="70"/>
  <text x="85" y="215" font-size="14" fill="#f0f0f0" text-anchor="middle" font-family="sans-serif">Wand</text>

  <!-- Radio waves going from the wand to the receiver. -->
  <g fill="none" stroke="#ff2bd6" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
    <path d="M160 115 Q172 130 160 145"/>
    <path d="M175 105 Q197 130 175 155" opacity=".7"/>
    <path d="M190 95 Q222 130 190 165" opacity=".4"/>
  </g>

  <!-- Receiver Micro:bit (plugged into the computer). -->
  <use href="#mb" x="240" y="70"/>
  <text x="295" y="215" font-size="14" fill="#f0f0f0" text-anchor="middle" font-family="sans-serif">Receiver</text>

  <!-- USB line from the receiver to the screen. -->
  <line x1="355" y1="130" x2="400" y2="130" stroke="#00d1ff" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- The screen with the p5.js particles. -->
  <rect x="400" y="30" width="270" height="215" rx="12" fill="#0b0b12" stroke="#00d1ff" stroke-width="2"/>

  <!-- A few curved lines to show the flow of the particles. -->
  <g fill="none" stroke-width="2" opacity=".35">
    <path d="M415 200 C470 120 520 230 575 140 S640 90 655 70" stroke="#00d1ff"/>
    <path d="M415 90 C470 150 530 60 590 150 S640 210 655 225" stroke="#ff2bd6"/>
  </g>

  <!-- The particles. Different sizes and neon colors. -->
  <g filter="url(#glow)">
    <circle cx="475" cy="122" r="1.4" fill="#8a7bff" opacity="0.74"/>
    <circle cx="438" cy="62" r="1.2" fill="#7dff6b" opacity="0.9"/>
    <circle cx="610" cy="60" r="1.7" fill="#7dff6b" opacity="0.64"/>
    <circle cx="459" cy="72" r="1.8" fill="#00d1ff" opacity="0.91"/>
    <circle cx="621" cy="111" r="3.1" fill="#ff2bd6" opacity="0.58"/>
    <circle cx="489" cy="205" r="3.3" fill="#7dff6b" opacity="0.54"/>
    <circle cx="570" cy="131" r="2.8" fill="#ff2bd6" opacity="0.59"/>
    <circle cx="536" cy="116" r="1.4" fill="#7dff6b" opacity="0.5"/>
    <circle cx="489" cy="191" r="2.9" fill="#7dff6b" opacity="0.92"/>
    <circle cx="545" cy="94" r="2.2" fill="#7dff6b" opacity="0.72"/>
    <circle cx="456" cy="104" r="1.9" fill="#00d1ff" opacity="0.54"/>
    <circle cx="533" cy="205" r="3.6" fill="#8a7bff" opacity="0.85"/>
    <circle cx="452" cy="217" r="1.7" fill="#8a7bff" opacity="0.96"/>
    <circle cx="577" cy="206" r="2.3" fill="#ff2bd6" opacity="0.68"/>
    <circle cx="606" cy="195" r="2.0" fill="#ff2bd6" opacity="0.95"/>
    <circle cx="440" cy="60" r="2.9" fill="#7dff6b" opacity="0.88"/>
    <circle cx="572" cy="105" r="1.5" fill="#ff2bd6" opacity="0.65"/>
    <circle cx="421" cy="55" r="2.1" fill="#00d1ff" opacity="0.95"/>
    <circle cx="488" cy="233" r="2.8" fill="#7dff6b" opacity="0.51"/>
    <circle cx="488" cy="127" r="3.5" fill="#8a7bff" opacity="0.93"/>
    <circle cx="637" cy="203" r="2.8" fill="#00d1ff" opacity="0.65"/>
    <circle cx="464" cy="158" r="1.9" fill="#7dff6b" opacity="0.69"/>
    <circle cx="455" cy="129" r="2.6" fill="#7dff6b" opacity="0.52"/>
    <circle cx="458" cy="138" r="3.1" fill="#7dff6b" opacity="1.0"/>
    <circle cx="561" cy="69" r="2.3" fill="#ff2bd6" opacity="0.71"/>
    <circle cx="468" cy="74" r="1.3" fill="#00d1ff" opacity="0.87"/>
    <circle cx="567" cy="218" r="3.5" fill="#00d1ff" opacity="0.77"/>
    <circle cx="564" cy="108" r="2.0" fill="#00d1ff" opacity="0.56"/>
    <circle cx="550" cy="119" r="3.1" fill="#8a7bff" opacity="0.83"/>
    <circle cx="466" cy="167" r="1.7" fill="#8a7bff" opacity="0.71"/>
    <circle cx="424" cy="101" r="2.2" fill="#ff2bd6" opacity="0.82"/>
    <circle cx="524" cy="100" r="2.4" fill="#00d1ff" opacity="0.52"/>
    <circle cx="479" cy="107" r="2.5" fill="#ff2bd6" opacity="0.71"/>
    <circle cx="481" cy="81" r="2.0" fill="#7dff6b" opacity="0.78"/>
    <circle cx="560" cy="148" r="3.5" fill="#00d1ff" opacity="0.75"/>
    <circle cx="438" cy="155" r="1.7" fill="#ff2bd6" opacity="0.67"/>
    <circle cx="583" cy="165" r="3.1" fill="#7dff6b" opacity="0.91"/>
    <circle cx="550" cy="100" r="2.8" fill="#7dff6b" opacity="0.67"/>
    <circle cx="515" cy="172" r="1.4" fill="#7dff6b" opacity="0.98"/>
    <circle cx="586" cy="93" r="1.3" fill="#ff2bd6" opacity="0.88"/>
    <circle cx="483" cy="215" r="3.3" fill="#ff2bd6" opacity="0.84"/>
    <circle cx="533" cy="190" r="2.3" fill="#8a7bff" opacity="0.96"/>
    <circle cx="470" cy="45" r="1.7" fill="#ff2bd6" opacity="0.51"/>
    <circle cx="639" cy="110" r="1.5" fill="#8a7bff" opacity="0.94"/>
    <circle cx="555" cy="58" r="3.3" fill="#ff2bd6" opacity="0.58"/>
  </g>
  <text x="535" y="270" font-size="14" fill="#f0f0f0" text-anchor="middle" font-family="sans-serif">p5.js canvas</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
